<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка для печати</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --burgundy-900: #2b0a12;
      --cherry-700: #5c1a2a;
      --cream-50: #fbf7ef;
      --ink-soft: #5f3d46;
      --gold: #b8963f;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Manrope", sans-serif;
      background: #e9e2d4;
      color: var(--burgundy-900);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      width: 105mm;
      min-height: 148mm;
      background: var(--cream-50);
      border: 1px solid rgba(92, 26, 42, 0.2);
      outline: 1px solid rgba(184, 150, 63, 0.4);
      outline-offset: -6px;
      border-radius: 10px;
      box-shadow: 0 20px 50px -20px rgba(43, 10, 18, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12mm 10mm;
      gap: 6mm;
    }
    .card svg { width: 16mm; color: var(--gold); }
    .card h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      font-size: 20pt;
      line-height: 1.25;
    }
    .card .scan {
      font-size: 10pt;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cherry-700);
      font-weight: 600;
    }
    .card img { width: 52mm; height: 52mm; }
    .card .promise {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: 11pt;
      color: var(--ink-soft);
      max-width: 70mm;
      line-height: 1.5;
    }
    @media print {
      body { background: none; padding: 0; }
      .card { box-shadow: none; width: 105mm; min-height: 148mm; }
    }
    @page { size: A6 portrait; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 60 60" fill="none" aria-hidden="true">
      <path d="M30 52 C30 40, 30 30, 30 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M30 34 C23 31, 19 25, 19 18 C25 21, 29 27, 30 34" fill="currentColor"/>
      <path d="M30 34 C37 31, 41 25, 41 18 C35 21, 31 27, 30 34" fill="currentColor"/>
      <path d="M30 45 C25 43, 22 39, 22 34 C26 36, 29 40, 30 45" fill="currentColor"/>
      <path d="M30 45 C35 43, 38 39, 38 34 C34 36, 31 40, 30 45" fill="currentColor"/>
    </svg>
    <h1>Здесь начинается<br>маленькая история.</h1>
    <p class="scan">Отсканируй QR-код</p>
    <img src="qr-code.png" alt="QR-код ведёт на сайт с маленькой историей">
    <p class="promise">Но сначала обещай, что не будешь искать ответы в интернете.</p>
  </div>
</body>
</html>
